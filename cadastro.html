<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Campus+ | Novo Projeto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>


<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
            href="index.html">

            🚀 Campus+

        </a>

    </div>

</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-8">

            <div class="card">

                <div class="card-body p-4">

                    <h2 class="mb-4">
                        ➕ Cadastrar Projeto
                    </h2>


                    <form id="formProjeto">


                        <div class="mb-3">

                            <label class="form-label">
                                Nome do projeto
                            </label>

                            <input type="text"
                                id="nomeProjeto"
                                class="form-control"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Integrantes
                            </label>

                            <input type="text"
                                id="integrantes"
                                class="form-control"
                                placeholder="Ex: João, Maria e Pedro"
                                required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Turma
                            </label>

                            <select id="turma"
                                class="form-select"
                                required>

                                <option value="">
                                    Selecione
                                </option>

                                <option>
                                    1DS
                                </option>

                                <option>
                                    2DS
                                </option>

                                <option>
                                    3DS
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Categoria
                            </label>

                            <select id="categoria"
                                class="form-select"
                                required>

                                <option value="">
                                    Selecione
                                </option>

                                <option>
                                    Tecnologia
                                </option>

                                <option>
                                    Educação
                                </option>

                                <option>
                                    Sustentabilidade
                                </option>

                                <option>
                                    Jogos
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Descrição
                            </label>

                            <textarea id="descricao"
                                class="form-control"
                                rows="5"
                                required>
                            </textarea>

                        </div>


                        <button type="submit"
                            class="btn btn-primary w-100">

                            🚀 Cadastrar projeto

                        </button>


                    </form>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="js/script.js"></script>

</body>

</html>
