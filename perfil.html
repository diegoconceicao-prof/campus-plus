<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Campus+ | Perfil</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet"
        href="css/style.css">

</head>

<body>


<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold"
            href="index.html">

            🚀 Campus+

        </a>

    </div>

</nav>


<main class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card profile-card">

                <div class="card-body text-center">

                    <div class="avatar">
                        👤
                    </div>

                    <h2>
                        João Silva
                    </h2>

                    <p class="text-muted">
                        Estudante
                    </p>


                    <hr>


                    <div class="row">

                        <div class="col-6">

                            <h4>3DS</h4>

                            <small>
                                Turma
                            </small>

                        </div>


                        <div class="col-6">

                            <h4>
                                Desenvolvimento
                            </h4>

                            <small>
                                Curso
                            </small>

                        </div>

                    </div>


                    <hr>


                    <div class="row">

                        <div class="col-4">

                            <h3>4</h3>

                            <small>
                                Projetos
                            </small>

                        </div>


                        <div class="col-4">

                            <h3>3</h3>

                            <small>
                                Eventos
                            </small>

                        </div>


                        <div class="col-4">

                            <h3>8</h3>

                            <small>
                                Atividades
                            </small>

                        </div>

                    </div>


                    <button class="btn btn-primary mt-4"
                        onclick="editarPerfil()">

                        ✏️ Editar perfil

                    </button>

                </div>

            </div>

        </div>

    </div>

</main>


<script src="js/script.js"></script>

</body>

</html>
